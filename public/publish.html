padding:10px 14px;color:#fff;text-decoration:none;font-size:13px;font-weight:800;white-space:nowrap}.go:hover{filter:brightness(1.1)}.empty{padding:42px 20px;border:1px dashed #40516d;border-radius:18px;text-align:center;color:#9eb1d2}.tip{margin:29px 0 0;text-align:center;color:#8192b2;font-size:13px}.tip kbd{border:1px solid #475569;border-bottom-width:2px;border-radius:6px;padding:2px 5px;color:#e5eefc;font-family:inherit}.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;pointer-events:none;border:1px solid #475569;border-radius:999px;background:#1e293b;padding:10px 16px;color:#fff;font-size:13px;transition:.2s}.toast.show{transform:translate(-50%,0);opacity:1}@media(max-width:560px){.page{padding:43px 0}.node{grid-template-columns:1fr;padding:15px}.go{width:100%}.notice{margin-top:27px}}

  <main class="page">
    <header class="hero"><div class="hero-mark">✦</div><h1 id="publish-page-title">星环导航 · 永久发布页</h1><p>实时探测可用镜像节点，为你推荐当前最快访问入口。</p></header>
